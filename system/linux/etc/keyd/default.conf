[ids]

*
# Leave the laptop hotkey devices alone; keyd drops key codes above 255.
# Ideapad extra buttons (touchpad, airplane, camera, mic mute)
-0000:0000
# Video Bus (brightness, display switch)
-0000:0006

[main]

# Maps capslock to escape when pressed and control when held
capslock = overload(control, esc)

# Remaps the escape key to capslock
esc = capslock
